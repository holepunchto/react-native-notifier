name: 🚀 Publish release
run-name: ${{ inputs.bumpVersion == 'none' && 'Re-try making a new release' || format('Release a new {0} version', inputs.bumpVersion) }}

on:
  workflow_dispatch:
    inputs:
      bumpVersion:
        type: choice
        description: Select version to bump
        default: none
        options:
          - none
          - patch
          - minor
          - major
          - prerelease

jobs:
  release:
    name: Release a new version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Print all inputs and global env variables
        id: input-and-env
        run: |
          echo "Inputs:"
          echo "${{ toJSON(github.event.inputs) }}"

          echo "Env:"
          echo "${{ toJSON(env) }}"

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Git config
        id: git-config
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'bot@github.actions.com'

      - name: Set up Node.js 🟢
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'
          scope: '@holepunchto'

      - name: Install dependencies
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Update version
        if: ${{ inputs.bumpVersion != 'none' }}
        run: |
          npm version ${{ inputs.bumpVersion }}
          git push --follow-tags

      - name: Publish a npm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(npm pkg get version | tr -d \")
          if [[ "$version" == *-* ]]; then
            npm publish --tag prerelease
          else
            npm publish
          fi

      - name: Publish Github Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(npm pkg get version | tr -d \")
          gh release create "v$version" --generate-notes
